# Sources for the daily brief. Add, remove or re-weight here; no code change needed.
#
# Fields
#   id        unique short name
#   name      shown next to the story
#   topic     home topic (must exist in config/topics.yaml)
#   also      other topics an item may be tagged to if its keywords fit better
#   subtopic  default sub-topic when keywords do not decide
#   type      rss | guardian | hackernews
#   url       feed URL (rss), or RSS fallback URL (guardian)
#   section   Guardian API section (guardian only)
#   weight    0–1, how much the source counts in ranking
#   access    full = feed text may be summarised; headline_only = title and link only
#   feed_order  editorial = the feed is ordered by importance, so position counts
#   require_keywords  item is kept only if its title contains one of these
#   enabled   false = skipped; `reason` says why
#
# Last verified: 2026-11-11 (session 1).

sources:
